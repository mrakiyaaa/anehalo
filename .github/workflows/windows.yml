name: Windows quality and release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/qa
      - run: npm ci
      - run: node scripts/check-version.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm audit
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: src-tauri/target/qa
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          CARGO_TARGET_DIR: src-tauri/target/qa
      - run: npm run build:debug
      - run: npm run test:e2e
      - run: npm run build:installer
      - run: node scripts/check-release-isolation.mjs
      - run: node scripts/verify-installer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            coverage
            playwright-report
            test-results
            src-tauri/target/qa/release/bundle/nsis/*.exe*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-validation
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/src-tauri/target/qa/release/bundle/nsis/*.exe*
