name: Windows quality

# Quality gates for branches and pull requests. Releases are built by release.yml
# when a v* tag is pushed, so tag pushes are deliberately not handled here.
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: windows-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: src-tauri/target/qa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/qa
      # NSIS tools that Tauri downloads on first installer build.
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\tauri
          key: tauri-nsis-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-nsis-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci
      - name: Check versions match
        run: node scripts/check-version.mjs

      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm run test:coverage
      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev
      - name: Audit all npm dependencies (reviewed exceptions only)
        run: node scripts/check-npm-audit.mjs

      - uses: taiki-e/install-action@cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build debug app for E2E
        run: npm run build:debug
      # The runner has no visible display, so the real app window runs unattended.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build Windows installer
        run: npm run build:installer
      - name: Check release build isolation
        run: node scripts/check-release-isolation.mjs
      - name: Verify installer
        run: node scripts/verify-installer.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            coverage
            playwright-report
            test-results
            src-tauri/target/qa/release/bundle/nsis/*.exe*
